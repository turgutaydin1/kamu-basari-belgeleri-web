services:
  basari-web:
    build: .
    container_name: basari-web
    restart: unless-stopped
    environment:
      BASARI_WEB_MODE: "1"
      WEB_DATA_ROOT: "/data"
      WEB_ADMIN_EMAIL: "${WEB_ADMIN_EMAIL}"
      WEB_ADMIN_PASSWORD: "${WEB_ADMIN_PASSWORD}"
      WEB_TRIAL_DAYS: "${WEB_TRIAL_DAYS:-7}"
      WEB_TRIAL_RECORD_LIMIT: "${WEB_TRIAL_RECORD_LIMIT:-10}"
      WEB_SESSION_DAYS: "${WEB_SESSION_DAYS:-7}"
    volumes:
      - /opt/basari-data:/data
    expose:
      - "8501"

  caddy:
    image: caddy:2-alpine
    container_name: basari-caddy
    restart: unless-stopped
    depends_on:
      - basari-web
    environment:
      APP_DOMAIN: "${APP_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
