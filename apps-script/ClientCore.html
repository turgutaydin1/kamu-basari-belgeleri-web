<script>
let TOKEN=localStorage.getItem('mia_basari_token')||'';
let USER=null, SETTINGS=null, DRAFTS=[], APPROVALS=[], ARCHIVE=[], BULK_ROWS=[], EXCEL_PREPARED=[];
let SEARCH_TIMER=null, ACTIVE_BULK='';
const $=id=>document.getElementById(id);
const api=(name,...args)=>new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))[name](...args)});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(text,error=false){$('globalMsg').innerHTML=text?`<div class="msg ${error?'err':''}">${esc(text)}</div>`:'';}
function authMsg(text,error=false){$('authMsg').innerHTML=text?`<div class="msg ${error?'err':''}">${esc(text)}</div>`:'';}
function failIf(r){if(!r||r.ok===false)throw new Error(r&&r.message?r.message:'İşlem tamamlanamadı.');return r;}
function statusHtml(s){const map={TASLAK:['draft','Taslak'],OLUR_LISTESINDE:['approval','Olur Listesinde'],TESLIM_EDILDI:['delivered','İmzalandı ve Teslim Edildi'],IPTAL:['cancelled','İptal']};const m=map[s]||['',s];return `<span class="status ${m[0]}">${esc(m[1])}</span>`;}
function docLabel(t){return t==='USTUN_BASARI'?'Üstün Başarı Belgesi':'Başarı Belgesi';}
function recNo(r){return r&&r.yil&&r.sayi?`${r.yil}/${String(r.sayi).padStart(3,'0')}`:'';}
function checked(css){return [...document.querySelectorAll(css+':checked')].map(x=>x.value);}
function downloadBase64(name,b64,mime){const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);const blob=new Blob([a],{type:mime});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function openAuth(type){$('authModal').classList.remove('hidden');$('loginBox').classList.toggle('hidden',type!=='login');$('registerBox').classList.toggle('hidden',type==='login');$('authTitle').textContent=type==='login'?'Üye Girişi':'Demoyu Dene';authMsg('');}
function closeAuth(){$('authModal').classList.add('hidden');}
async function register(){try{const r=failIf(await api('registerUser',$('regName').value,$('regEmail').value,$('regPass').value));authMsg(r.message||'Demo hesabı oluşturuldu.');$('loginEmail').value=$('regEmail').value;openAuth('login');}catch(e){authMsg(e.message,true)}}
async function login(){try{const r=failIf(await api('loginUser',$('loginEmail').value,$('loginPass').value));TOKEN=r.token;USER=r.user;localStorage.setItem('mia_basari_token',TOKEN);closeAuth();await enterApp();}catch(e){authMsg(e.message,true)}}
async function logout(){try{await api('logoutUser',TOKEN)}catch(e){}localStorage.removeItem('mia_basari_token');location.reload();}
async function enterApp(){try{if(!USER){const s=failIf(await api('getSession',TOKEN));USER=s.user;}$('landing').classList.add('hidden');$('application').classList.remove('hidden');$('userName').textContent=USER.full_name||USER.email;$('userPlan').textContent=USER.plan==='FULL'?'Tam Sürüm':'Demo';$('adminShortcut').classList.toggle('hidden',USER.role!=='ADMIN');await loadSettingsAll();await loadDashboard();showPage('home');}catch(e){localStorage.removeItem('mia_basari_token');TOKEN='';$('landing').classList.remove('hidden');$('application').classList.add('hidden');}}

function showPage(name,button){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));const p=$('page-'+name);if(p)p.classList.remove('hidden');document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));const b=button||document.querySelector(`.menu button[data-page="${name}"]`);if(b)b.classList.add('active');msg('');if(name==='home')loadDashboard();if(name==='new')prepareNewPage();if(name==='drafts')loadDrafts();if(name==='approval')loadApproval();if(name==='archive')prepareArchive();if(name==='settings')loadSettingsAll();if(name==='backup'){} }

async function loadDashboard(){try{const r=failIf(await api('getDashboard',TOKEN));USER=r.user;const s=r.stats;$('stTotal').textContent=s.total;$('stDraft').textContent=s.draft;$('stApproval').textContent=s.approval;$('stDelivered').textContent=s.delivered;$('stCancelled').textContent=s.cancelled;$('stSuccess').textContent=s.success;$('stSuperior').textContent=s.superior;$('stCreatedYear').textContent=s.created_this_year;$('stDeliveredYear').textContent=s.delivered_this_year;$('createdLabel').textContent=`${s.year} Yılında Oluşturulan`;$('deliveredLabel').textContent=`${s.year} Yılında İmzalanıp Teslim Edilen`;$('homeSubtitle').textContent=`${s.year} yılı ve tüm kayıt durumları`;
if(USER.plan==='TRIAL'){const remain=Math.max(0,Number(USER.record_limit||0)-Number(USER.records_created||0));$('trialBox').innerHTML=`<div class="note"><b>Demo üyeliği</b> • Kullanılan kayıt: ${USER.records_created}/${USER.record_limit} • Kalan: ${remain} • Bitiş: ${USER.trial_ends_at?new Date(USER.trial_ends_at).toLocaleString('tr-TR'):'-'}</div>`}else $('trialBox').innerHTML='';}catch(e){msg(e.message,true)}}
function delayedSearch(){clearTimeout(SEARCH_TIMER);SEARCH_TIMER=setTimeout(runGlobalSearch,260)}
async function runGlobalSearch(){try{const q=$('globalSearch').value.trim();if(!q){$('searchResults').innerHTML='';return}const r=failIf(await api('globalSearch',TOKEN,q));$('searchResults').innerHTML=(r.records||[]).map(x=>`<div class="searchItem"><div><b>${esc(x.ad_soyad)}</b><div class="muted">${esc(x.tc_kimlik)}</div></div><div>${esc(docLabel(x.belge_turu))}</div><div>${esc(x.gorev_yeri||x.unvan||'')}</div><div><button class="btn small secondary" onclick="openRecord('${x.id}')">Aç</button></div></div>`).join('')||'<p class="muted">Kayıt bulunamadı.</p>';}catch(e){msg(e.message,true)}}

async function loadSettingsAll(){try{const r=failIf(await api('getFullSettings',TOKEN));SETTINGS=r.settings;const p=SETTINGS.program||{};$('institutionLine').textContent=[p.kurum_adi,p.birim_adi].filter(Boolean).join(' • ')||p.alt_aciklama||'';populateNewDefaults();renderSettings();}catch(e){msg(e.message,true)}}
function populateNewDefaults(){if(!SETTINGS)return;const type=currentDocType(),doc=SETTINGS.document_by_type[type]||{};$('newPlace').value=$('newPlace').value||SETTINGS.program.default_gorev_yeri||'';$('newReward').value=$('newReward').value||doc.default_taltif_text||'';const reasons=SETTINGS.reasons_by_type[type]||[];$('newReasonSelect').innerHTML='<option value="">— Gerekçe Seç —</option>'+reasons.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('newSigner').innerHTML=(SETTINGS.signers||[]).filter(s=>s.active!==false).map((s,i)=>`<option value="${i}">${esc(s.name)} — ${esc(String(s.title||'').replace(/\n/g,' / '))}</option>`).join('');}
function currentDocType(){return document.querySelector('input[name="doctype"]:checked')?.value||'BASARI';}
function reasonSelectChanged(){const v=$('newReasonSelect').value;if(v)$('newReason').value=v;}
function docTypeChanged(){if(!SETTINGS)return;const type=currentDocType();$('superiorBox').classList.toggle('hidden',type!=='USTUN_BASARI');const doc=SETTINGS.document_by_type[type]||{};$('newReward').value=doc.default_taltif_text||'';populateNewDefaults();if(type==='USTUN_BASARI')tcChanged();}
function signatureModeChanged(){$('signaturePanel').classList.toggle('hidden',$('newSignatureMode').value!=='IMAGE');}
function superiorManualChanged(){$('superiorManualArea').classList.toggle('hidden',!$('superiorManual').checked);}
async function prepareNewPage(){if(!SETTINGS)await loadSettingsAll();populateNewDefaults();signatureModeChanged();docTypeChanged();}
async function tcChanged(){const tc=$('newTc').value.replace(/\D/g,'');$('newTc').value=tc.slice(0,11);if(tc.length!==11){$('personFound').textContent='';if(currentDocType()==='USTUN_BASARI')$('superiorSources').innerHTML='<span class="muted">11 haneli T.C. Kimlik No girin.</span>';return}try{const p=failIf(await api('getPersonProfile',TOKEN,tc));if(p.profile){$('newName').value=p.profile.ad_soyad||'';$('newTitle').value=p.profile.unvan||'';$('newPlace').value=p.profile.gorev_yeri||SETTINGS?.program?.default_gorev_yeri||'';$('personFound').textContent='Kayıtlı personel bilgileri getirildi.';if(p.profile.foto_path){$('newPhotoPath').value=p.profile.foto_path;$('personFound').textContent+=' Kayıtlı fotoğraf yeniden kullanılacak.'}}else $('personFound').textContent='Yeni personel.';if(currentDocType()==='USTUN_BASARI')await loadSuperiorSources(tc);}catch(e){msg(e.message,true)}}
async function loadSuperiorSources(tc){try{const r=failIf(await api('eligibleSuperiorSources',TOKEN,tc));const rows=r.records||[];$('superiorSources').innerHTML=rows.length?rows.map(x=>`<label class="inlineCheck" style="display:block;margin:7px 0"><input type="checkbox" class="superiorSource" value="${x.id}"> ${esc(x.tarih||'')} • ${esc(recNo(x))} • ${esc(x.gerekce||'Başarı Belgesi')}</label>`).join(''):'<div class="note">Sistemde kullanılabilir Başarı Belgesi dayanağı bulunamadı. Eski/sistem dışı belgeler varsa gerekçeli manuel devam kullanılabilir.</div>';}catch(e){$('superiorSources').innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
function readDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Dosya okunamadı.'));r.readAsDataURL(file)})}
async function uploadNewPhoto(){try{const f=$('newPhoto').files[0];if(!f)return;const r=failIf(await api('uploadUserFile',TOKEN,await readDataUrl(f),f.name,'photo'));$('newPhotoPath').value=r.path;$('photoPreview').src=await readDataUrl(f);$('photoPreview').classList.remove('hidden');}catch(e){msg(e.message,true)}}
async function uploadNewSignature(){try{const f=$('newSignatureFile').files[0];if(!f)return;const r=failIf(await api('uploadUserFile',TOKEN,await readDataUrl(f),f.name,'signature'));$('newSignaturePath').value=r.path;$('signaturePreview').src=await readDataUrl(f);$('signaturePreview').classList.remove('hidden');}catch(e){msg(e.message,true)}}
function selectedSigner(){const arr=(SETTINGS&&SETTINGS.signers)||[];return arr[Number($('newSigner').value||0)]||{};}
async function saveNewRecord(again){try{const signer=selectedSigner(),manual=$('superiorManual').checked;const refs=[...document.querySelectorAll('.superiorSource:checked')].map(x=>x.value);const data={belge_turu:currentDocType(),tc_kimlik:$('newTc').value,ad_soyad:$('newName').value,unvan:$('newTitle').value,gorev_yeri:$('newPlace').value,gerekce:$('newReason').value,taltif_metni:$('newReward').value,foto_path:$('newPhotoPath').value,signature_mode:$('newSignatureMode').value,signer_name:signer.name||'',signer_title:signer.title||'',signature_path:$('newSignaturePath').value||(signer.signature_path||''),superior_basis_refs:refs,superior_manual_override:manual,superior_override_reason:$('superiorManualReason').value,superior_override_note:$('superiorManualNote').value};const r=failIf(await api('createRecord',TOKEN,data));msg(r.message||'Taslak kayıt oluşturuldu.');await loadDashboard();if(again)clearNewForm();else showPage('drafts');}catch(e){msg(e.message,true)}}
function clearNewForm(){['newTc','newName','newTitle','newReason','newPhotoPath','newSignaturePath','superiorManualReason','superiorManualNote'].forEach(id=>$(id).value='');$('newPlace').value=SETTINGS?.program?.default_gorev_yeri||'';$('photoPreview').classList.add('hidden');$('signaturePreview').classList.add('hidden');$('superiorManual').checked=false;superiorManualChanged();document.querySelector('input[name="doctype"][value="BASARI"]').checked=true;docTypeChanged();}

async function previewExcel(){try{const f=$('excelFile').files[0];if(!f)throw new Error('Excel dosyası seçin.');const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});const r=failIf(await api('buildExcelPreviewFromRows',TOKEN,rows));EXCEL_PREPARED=r.prepared||[];const preview=r.preview||[];$('excelPreviewArea').innerHTML=`<div class="panel"><div class="sectionTitle"><h3>Aktarım Önizlemesi</h3><span class="pill">Uygun: ${EXCEL_PREPARED.length} • Hatalı: ${(r.errors||[]).length}</span></div><div class="tablewrap"><table><thead><tr><th>Satır</th><th>Belge Türü</th><th>TC</th><th>Ad Soyad</th><th>Ünvan</th><th>Görev Yeri</th><th>Dayanak</th><th>Durum</th></tr></thead><tbody>${preview.map(x=>`<tr><td>${esc(x.SATIR)}</td><td>${esc(x['BELGE TÜRÜ'])}</td><td>${esc(x['TC KİMLİK NO'])}</td><td>${esc(x['AD-SOYAD'])}</td><td>${esc(x.UNVAN)}</td><td>${esc(x['GÖREV YERİ'])}</td><td>${esc(x['ÜSTÜN BAŞARI DAYANAK']||'')}</td><td>${x.DURUM==='Uygun'?'<span class="okText">Uygun</span>':`<span class="dangerText">${esc(x.HATA)}</span>`}</td></tr>`).join('')}</tbody></table></div><br><button class="btn green" ${EXCEL_PREPARED.length?'':'disabled'} onclick="commitExcelImport()">Uygun Kayıtları Taslak Olarak Aktar</button></div>`;}catch(e){msg(e.message,true)}}
async function commitExcelImport(){try{if(!EXCEL_PREPARED.length)return;const r=failIf(await api('importPreparedExcelRows',TOKEN,EXCEL_PREPARED));msg(`${r.imported} kayıt aktarıldı.${(r.errors||[]).length?' '+r.errors.join(' | '):''}`,!!(r.errors||[]).length);EXCEL_PREPARED=[];await loadDashboard();}catch(e){msg(e.message,true)}}

async function loadDrafts(){try{const r=failIf(await api('listRecords',TOKEN,'TASLAK'));DRAFTS=r.records||[];renderDraftRows();}catch(e){msg(e.message,true)}}
function renderDraftRows(){const q=($('draftSearch')?.value||'').toLocaleLowerCase('tr-TR'),t=$('draftTypeFilter')?.value||'TUMU';const rows=DRAFTS.filter(r=>(t==='TUMU'||r.belge_turu===t)&&(!q||[r.ad_soyad,r.tc_kimlik,r.unvan,r.gorev_yeri].join(' ').toLocaleLowerCase('tr-TR').includes(q)));$('draftRows').innerHTML=rows.map(r=>`<tr><td><input type="checkbox" class="draftCheck" value="${r.id}"></td><td>${esc(docLabel(r.belge_turu))}</td><td>${esc(r.tc_kimlik)}</td><td><b>${esc(r.ad_soyad)}</b></td><td>${esc(r.unvan)}</td><td>${esc(r.gorev_yeri)}</td><td>${r.foto_path?'✅':'❌'}</td><td><button class="btn small secondary" onclick="openRecord('${r.id}')">Aç / Düzenle</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Taslak kayıt bulunmuyor.</td></tr>';}
async function draftsToApproval(){try{const ids=checked('.draftCheck');if(!ids.length)throw new Error('Kayıt seçin.');if(!confirm(`${ids.length} kayıt Olur listesine eklensin mi?`))return;const r=failIf(await api('moveToApproval',TOKEN,ids,''));msg(`${r.count} kayıt Olur listesine eklendi.`);await loadDrafts();await loadDashboard();}catch(e){msg(e.message,true)}}
async function deleteDrafts(){try{const ids=checked('.draftCheck');if(!ids.length)throw new Error('Kayıt seçin.');if(!confirm('Seçili taslaklar kalıcı olarak silinsin mi?'))return;for(const id of ids)failIf(await api('deleteDraftRecord',TOKEN,id));msg(`${ids.length} taslak silindi.`);await loadDrafts();await loadDashboard();}catch(e){msg(e.message,true)}}

async function loadApproval(){try{const r=failIf(await api('listRecords',TOKEN,'OLUR_LISTESINDE'));APPROVALS=r.records||[];$('approvalRows').innerHTML=APPROVALS.map(x=>`<tr><td><input type="checkbox" class="approvalCheck" value="${x.id}"></td><td>${esc(docLabel(x.belge_turu))}</td><td><b>${esc(x.ad_soyad)}</b></td><td>${esc(x.tc_kimlik)}</td><td>${esc(String(x.approval_list_id||'').slice(0,8))}</td><td>${esc(x.tarih||'')}</td><td>${esc(recNo(x))}</td><td>${x.pdf_file_id?'✅ Hazır':'⏳ Hazırlanmadı'}</td><td><button class="btn small" onclick="generateCertificatePdf('${x.id}')">PDF Hazırla</button> <button class="btn small secondary" onclick="openRecord('${x.id}')">Detay</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">Olur Listesinde kayıt bulunmuyor.</td></tr>';await loadApprovalLists();}catch(e){msg(e.message,true)}}
async function loadApprovalLists(){try{const r=failIf(await api('listApprovalLists',TOKEN));$('approvalGroups').innerHTML='<h3>Olur Grupları</h3>'+((r.lists||[]).map(x=>`<div class="subpanel" style="margin:8px 0"><b>${esc(docLabel(x.belge_turu))}</b> • ${new Date(x.created_at).toLocaleString('tr-TR')} • ${x.item_count} kayıt <button class="btn small secondary" onclick="showApprovalGroup('${x.id}')">Grubu Aç</button></div>`).join('')||'<p class="muted">Olur grubu yok.</p>');}catch(e){msg(e.message,true)}}
async function showApprovalGroup(id){try{const r=failIf(await api('getApprovalListDetail',TOKEN,id));$('recordModalBody').innerHTML=`<h3>${esc(docLabel(r.approval_list.belge_turu))} — Olur Grubu</h3><p class="muted">${new Date(r.approval_list.created_at).toLocaleString('tr-TR')}</p><div class="tablewrap"><table><thead><tr><th>Sıra</th><th>Ad Soyad</th><th>TC</th><th>Ünvan</th><th>Görev Yeri</th><th>Tarih/Sayı</th><th>Durum</th></tr></thead><tbody>${(r.items||[]).map(x=>`<tr><td>${esc(x.item.sira_no)}</td><td>${esc(x.item.ad_soyad)}</td><td>${esc(x.item.tc_kimlik)}</td><td>${esc(x.item.unvan)}</td><td>${esc(x.item.gorev_yeri)}</td><td>${esc(x.item.tarih||'')} ${esc(x.item.sayi||'')}</td><td>${x.record?statusHtml(x.record.status):'Kayıt yok'}</td></tr>`).join('')}</tbody></table></div>`;$('recordModal').classList.remove('hidden');}catch(e){msg(e.message,true)}}
async function approvalReturnDraft(){try{const ids=checked('.approvalCheck');if(!ids.length)throw new Error('Kayıt seçin.');const reason=prompt('Taslağa dönüş nedeni:');if(!reason)return;for(const id of ids)failIf(await api('returnToDraft',TOKEN,id,reason));msg('Uygun kayıtlar Taslağa döndürüldü.');await loadApproval();await loadDashboard();}catch(e){msg(e.message,true)}}
async function approvalDelivered(){try{const ids=checked('.approvalCheck');if(!ids.length)throw new Error('Kayıt seçin.');if(!confirm('Seçili ve PDF hazırlanmış kayıtlar İmzalandı ve Teslim Edildi yapılsın mı?'))return;const r=failIf(await api('markDelivered',TOKEN,ids));msg(`${r.count} kayıt arşive geçirildi.`);await loadApproval();await loadDashboard();}catch(e){msg(e.message,true)}}

async function prepareArchive(){try{const y=failIf(await api('listAvailableYears',TOKEN));$('archiveYear').innerHTML='<option value="">Tüm Yıllar</option>'+(y.years||[]).map(x=>`<option value="${x}">${x}</option>`).join('');await loadArchive();}catch(e){msg(e.message,true)}}
async function loadArchive(){try{const r=failIf(await api('listArchiveRecords',TOKEN,{query:$('archiveSearch')?.value||'',belge_turu:$('archiveType')?.value||'TUMU',status:$('archiveStatus')?.value||'TUMU',yil:$('archiveYear')?.value||''}));ARCHIVE=r.records||[];$('archiveRows').innerHTML=ARCHIVE.map(x=>`<tr><td>${esc(docLabel(x.belge_turu))}</td><td>${esc(x.tc_kimlik)}</td><td><b>${esc(x.ad_soyad)}</b></td><td>${esc(x.unvan)}</td><td>${esc(x.gorev_yeri)}</td><td>${esc(x.tarih||'')}</td><td>${esc(recNo(x))}</td><td>${statusHtml(x.status)}</td><td>${x.pdf_file_id?`<button class="btn small secondary" onclick="downloadStoredPdf('${x.id}')">PDF</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Arşiv kaydı bulunmuyor.</td></tr>';}catch(e){msg(e.message,true)}}

const BULK_LABELS={bulk_finalize:'Toplu Olur Listesine Ekle',bulk_delivered:'Toplu İmzalandı ve Teslim Edildi',bulk_return:'Toplu Taslağa Döndür',bulk_pdf:'Toplu PDF İndir',bulk_backup:'Toplu Yedekleme',bulk_photo:'Fotoğrafları Eşleştir',bulk_delete:'Toplu Sil',bulk_cancel:'Toplu İptal'};
async function bulkChanged(){ACTIVE_BULK=$('bulkMenu').value;if(!ACTIVE_BULK)return;showPage('bulk');$('bulkTitle').textContent=BULK_LABELS[ACTIVE_BULK]||'Toplu İşlemler';$('bulkInfo').textContent=ACTIVE_BULK;$('bulkExtra').innerHTML=['bulk_return','bulk_delete','bulk_cancel'].includes(ACTIVE_BULK)?'<label>İşlem Nedeni *</label><input id="bulkReason" placeholder="Neden girin">':'';$('bulkExecuteBtn').textContent=BULK_LABELS[ACTIVE_BULK]||'İşlemi Uygula';await fillBulkYears();await loadBulkCandidates();$('bulkMenu').value='';}
async function fillBulkYears(){try{const r=failIf(await api('listAvailableYears',TOKEN));$('bulkYear').innerHTML='<option value="">Tüm Yıllar</option>'+(r.years||[]).map(y=>`<option value="${y}">${y}</option>`).join('')}catch(e){}}
async function loadBulkCandidates(){if(!ACTIVE_BULK)return;try{const r=failIf(await api('listBulkCandidates',TOKEN,ACTIVE_BULK,{query:$('bulkSearch')?.value||'',belge_turu:$('bulkType')?.value||'TUMU',yil:$('bulkYear')?.value||''}));BULK_ROWS=r.records||[];$('bulkRows').innerHTML=BULK_ROWS.map(x=>`<tr><td><input type="checkbox" class="bulkCheck" value="${x.id}"></td><td>${esc(docLabel(x.belge_turu))}</td><td>${esc(x.tc_kimlik)}</td><td><b>${esc(x.ad_soyad)}</b></td><td>${statusHtml(x.status)}</td><td>${esc(x.tarih||'')} ${esc(recNo(x))}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Bu işlem için uygun kayıt bulunmuyor.</td></tr>';}catch(e){msg(e.message,true)}}
async function executeBulkOperation(){try{const ids=checked('.bulkCheck');if(!ids.length)throw new Error('Kayıt seçin.');const reason=$('bulkReason')?.value||'';if(ACTIVE_BULK==='bulk_finalize')failIf(await api('bulkMoveToApproval',TOKEN,ids,'Toplu Olur Listesine Ekle'));else if(ACTIVE_BULK==='bulk_delivered')failIf(await api('bulkMarkDelivered',TOKEN,ids));else if(ACTIVE_BULK==='bulk_return')failIf(await api('bulkReturnToDraft',TOKEN,ids,reason));else if(ACTIVE_BULK==='bulk_delete')failIf(await api('bulkDeleteRecords',TOKEN,ids,reason));else if(ACTIVE_BULK==='bulk_cancel')failIf(await api('bulkCancelRecords',TOKEN,ids,reason));else if(ACTIVE_BULK==='bulk_photo')failIf(await api('bulkMatchExistingPhotos',TOKEN,ids));else if(ACTIVE_BULK==='bulk_pdf'){await downloadPdfZip(ids);return}else if(ACTIVE_BULK==='bulk_backup'){await downloadSelectedBackup(ids);return}msg('Toplu işlem tamamlandı.');await loadBulkCandidates();await loadDashboard();}catch(e){msg(e.message,true)}}

async function openRecord(id){try{const r=failIf(await api('getRecordDetail',TOKEN,id)),x=r.record;let body=`<div class="grid2"><div><b>${esc(docLabel(x.belge_turu))}</b><p>${statusHtml(x.status)}</p><p><b>TC:</b> ${esc(x.tc_kimlik)}</p><p><b>Ad Soyad:</b> ${esc(x.ad_soyad)}</p><p><b>Ünvan:</b> ${esc(x.unvan)}</p><p><b>Görev Yeri:</b> ${esc(x.gorev_yeri)}</p></div><div><p><b>Tarih:</b> ${esc(x.tarih||'-')}</p><p><b>Sayı:</b> ${esc(recNo(x)||'-')}</p><p><b>Gerekçe:</b><br>${esc(x.gerekce||'-')}</p><p><b>Taltif Metni:</b><br>${esc(x.taltif_metni||'-')}</p></div></div>`;
if(r.superior_basis?.length)body+=`<div class="subpanel"><b>Üstün Başarı Dayanakları</b><pre>${esc(JSON.stringify(r.superior_basis,null,2))}</pre></div>`;
if(r.can_edit)body+=`<hr><h3>Taslağı Düzenle</h3><div class="grid2"><div><label>Ad Soyad</label><input id="editName" value="${esc(x.ad_soyad)}"><label>Ünvan</label><input id="editTitle" value="${esc(x.unvan)}"></div><div><label>Görev Yeri</label><input id="editPlace" value="${esc(x.gorev_yeri)}"><label>Gerekçe</label><textarea id="editReason">${esc(x.gerekce)}</textarea></div></div><label>Taltif Metni</label><textarea id="editReward">${esc(x.taltif_metni)}</textarea><br><button class="btn green" onclick="saveDraftEdit('${x.id}','${esc(x.tc_kimlik)}')">Değişiklikleri Kaydet</button>`;
if(x.pdf_file_id)body+=` <button class="btn secondary" onclick="downloadStoredPdf('${x.id}')">PDF İndir</button>`;$('recordModalBody').innerHTML=body;$('recordModal').classList.remove('hidden');}catch(e){msg(e.message,true)}}
function closeRecordModal(){$('recordModal').classList.add('hidden')}
async function saveDraftEdit(id,tc){try{failIf(await api('updateDraftRecord',TOKEN,id,{tc_kimlik:tc,ad_soyad:$('editName').value,unvan:$('editTitle').value,gorev_yeri:$('editPlace').value,gerekce:$('editReason').value,taltif_metni:$('editReward').value}));closeRecordModal();msg('Taslak güncellendi.');await loadDrafts();}catch(e){msg(e.message,true)}}

function settingsTab(name){document.querySelectorAll('.settingsPane').forEach(x=>x.classList.add('hidden'));$('settings-'+name).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));const id={program:'tabProgram',documents:'tabDocuments',signers:'tabSigners',templates:'tabTemplates'}[name];$(id).classList.add('active');}
function renderSettings(){if(!SETTINGS)return;const p=SETTINGS.program||{},b=SETTINGS.document_by_type.BASARI||{},u=SETTINGS.document_by_type.USTUN_BASARI||{};$('cfgProgramName').value=p.program_adi||'';$('cfgInstitution').value=p.kurum_adi||'';$('cfgUnit').value=p.birim_adi||'';$('cfgSubtitle').value=p.alt_aciklama||'';$('cfgDefaultPlace').value=p.default_gorev_yeri||'';$('cfgVersion').value=p.surum||'';$('cfgBasariNumber').value=b.number_format||'';$('cfgBasariReward').value=b.default_taltif_text||'';$('cfgBasariLaw').value=b.legislation_text||'';$('cfgBasariReasons').value=(SETTINGS.reasons_by_type.BASARI||[]).join('\n');$('cfgUstunNumber').value=u.number_format||'';$('cfgUstunReward').value=u.default_taltif_text||'';$('cfgUstunLaw').value=u.legislation_text||'';$('cfgUstunReasons').value=(SETTINGS.reasons_by_type.USTUN_BASARI||[]).join('\n');renderSignerEditor();renderTemplateSettings();settingsTab('program');}
async function saveProgramSettingsUi(){try{failIf(await api('saveProgramSettings',TOKEN,{program_adi:$('cfgProgramName').value,kurum_adi:$('cfgInstitution').value,birim_adi:$('cfgUnit').value,alt_aciklama:$('cfgSubtitle').value,default_gorev_yeri:$('cfgDefaultPlace').value,surum:$('cfgVersion').value}));await loadSettingsAll();msg('Program / kurum ayarları kaydedildi.')}catch(e){msg(e.message,true)}}
async function saveDocumentSettingsUi(){try{failIf(await api('saveDocumentTypeSettings',TOKEN,'BASARI',{number_format:$('cfgBasariNumber').value,default_taltif_text:$('cfgBasariReward').value,legislation_text:$('cfgBasariLaw').value}));failIf(await api('saveDocumentTypeSettings',TOKEN,'USTUN_BASARI',{number_format:$('cfgUstunNumber').value,default_taltif_text:$('cfgUstunReward').value,legislation_text:$('cfgUstunLaw').value}));failIf(await api('saveReasonsByType',TOKEN,'BASARI',$('cfgBasariReasons').value.split(/\r?\n/).filter(Boolean)));failIf(await api('saveReasonsByType',TOKEN,'USTUN_BASARI',$('cfgUstunReasons').value.split(/\r?\n/).filter(Boolean)));await loadSettingsAll();msg('Belge metinleri, numaralandırma ve gerekçeler kaydedildi.')}catch(e){msg(e.message,true)}}
function renderSignerEditor(){const arr=SETTINGS.signers||[];$('signerEditor').innerHTML=arr.map((s,i)=>`<div class="subpanel signerRow" data-i="${i}" style="margin-bottom:10px"><div class="grid3"><div><label>Ad Soyad</label><input class="signerName" value="${esc(s.name||'')}"></div><div><label>Ünvan (iki satır için satır sonu kullanın)</label><textarea class="signerTitle">${esc(s.title||'')}</textarea></div><div><label>Varsayılan İmza</label><select class="signerMode"><option value="WET" ${s.default_signature_mode!=='IMAGE'?'selected':''}>Fiziki</option><option value="IMAGE" ${s.default_signature_mode==='IMAGE'?'selected':''}>Görsel</option></select></div></div><label class="inlineCheck"><input class="signerActive" type="checkbox" ${s.active!==false?'checked':''}> Aktif</label></div>`).join('');}
function addSignerRow(){SETTINGS.signers=SETTINGS.signers||[];SETTINGS.signers.push({id:String(Date.now()),name:'',title:'',active:true,default_signature_mode:'WET'});renderSignerEditor();}
async function saveSignersUi(){try{const rows=[...document.querySelectorAll('.signerRow')].map((el,i)=>({id:(SETTINGS.signers[i]||{}).id||String(i+1),name:el.querySelector('.signerName').value,title:el.querySelector('.signerTitle').value,active:el.querySelector('.signerActive').checked,default_signature_mode:el.querySelector('.signerMode').value,signature_path:(SETTINGS.signers[i]||{}).signature_path||'',start_date:(SETTINGS.signers[i]||{}).start_date||'',end_date:(SETTINGS.signers[i]||{}).end_date||'Devam Ediyor'}));failIf(await api('saveSigners',TOKEN,rows));await loadSettingsAll();msg('Amir / imza ayarları kaydedildi.')}catch(e){msg(e.message,true)}}
async function renderTemplateSettings(){try{const t=failIf(await api('getTemplateSettings',TOKEN)),s=failIf(await api('getTemplateAssetStatus',TOKEN));const opts=t.templates.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('');$('cfgBasariTemplate').innerHTML=opts;$('cfgUstunTemplate').innerHTML=opts;$('cfgBasariTemplate').value=t.default_by_document_type.BASARI;$('cfgUstunTemplate').value=t.default_by_document_type.USTUN_BASARI;$('templateCards').innerHTML=t.templates.map(x=>`<div class="subpanel"><h4>${esc(x.label)}</h4><p>${s.status[x.id]?.exists?'<span class="okText">✓ Şablon görseli yüklü</span>':'<span class="dangerText">Şablon görseli yüklenmemiş</span>'}</p><input id="tpl_${x.id}" type="file" accept="image/png,image/jpeg"><br><br><button class="btn small" onclick="uploadTemplateUi('${x.id}')">Şablon Görselini Yükle / Değiştir</button></div>`).join('');}catch(e){msg(e.message,true)}}
async function uploadTemplateUi(id){try{const f=$('tpl_'+id).files[0];if(!f)throw new Error('Şablon görselini seçin.');failIf(await api('uploadTemplateAsset',TOKEN,id,await readDataUrl(f),f.name));msg(`${id} şablonu yüklendi.`);await renderTemplateSettings();}catch(e){msg(e.message,true)}}
async function saveTemplateDefaultsUi(){try{failIf(await api('setDefaultTemplateForType',TOKEN,'BASARI',$('cfgBasariTemplate').value));failIf(await api('setDefaultTemplateForType',TOKEN,'USTUN_BASARI',$('cfgUstunTemplate').value));await loadSettingsAll();msg('Varsayılan şablonlar kaydedildi.')}catch(e){msg(e.message,true)}}

async function downloadFullBackup(){try{const r=failIf(await api('createFullBackupWeb',TOKEN));downloadBase64(r.name,r.base64,'application/zip');msg('Tam yedek indirildi.')}catch(e){msg(e.message,true)}}
async function downloadCsvExport(){try{const r=failIf(await api('exportRecordsCsvWeb',TOKEN,{}));downloadBase64(r.name,r.base64,'text/csv');msg('CSV dışa aktarımı indirildi.')}catch(e){msg(e.message,true)}}

async function showAdminUsers(){showPage('admin');try{const r=failIf(await api('getAdminUsers',TOKEN));const users=(r.users||[]).filter(x=>x.role!=='ADMIN');$('adminUsers').innerHTML=users.map(u=>`<div class="panel"><div class="sectionTitle"><div><b>${esc(u.full_name)}</b><div class="muted">${esc(u.email)}</div></div><span class="pill">${esc(u.plan)}</span></div><div class="grid3"><div><label>Plan</label><select id="ap_${u.id}"><option value="TRIAL" ${u.plan==='TRIAL'?'selected':''}>TRIAL</option><option value="FULL" ${u.plan==='FULL'?'selected':''}>FULL</option><option value="BLOCKED" ${u.plan==='BLOCKED'?'selected':''}>BLOCKED</option></select></div><div><label>Demo Gün</label><input id="ad_${u.id}" type="number" value="7"></div><div><label>Kayıt Limiti</label><input id="al_${u.id}" type="number" value="${u.record_limit||10}"></div></div><br><button class="btn small" onclick="saveAdminUser('${u.id}')">Güncelle</button></div>`).join('')||'<p class="muted">Kullanıcı yok.</p>';}catch(e){msg(e.message,true)}}
async function saveAdminUser(id){try{failIf(await api('adminUpdateUser',TOKEN,id,$('ap_'+id).value,Number($('ad_'+id).value),Number($('al_'+id).value),true));msg('Üyelik güncellendi.');await showAdminUsers();}catch(e){msg(e.message,true)}}

(async()=>{if(!TOKEN)return;try{const s=await api('getSession',TOKEN);if(s&&s.ok){USER=s.user;await enterApp()}else localStorage.removeItem('mia_basari_token')}catch(e){localStorage.removeItem('mia_basari_token')}})();
</script>
