<style>
:root{--navy:#173a5e;--navy2:#224e78;--bg:#f4f7fa;--line:#d7e0e8;--text:#17212b;--muted:#607386;--white:#fff;--danger:#a61b1b;--green:#176b45;--orange:#a85d00;--soft:#eef3f7}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:20}.topin{max-width:1580px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.brandIcon{width:44px;height:44px;border-radius:9px;background:linear-gradient(145deg,var(--navy),#0d243b);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}.brand h1{font-size:18px;margin:0;color:var(--navy)}.brand small{color:var(--muted)}

.wrap{max-width:1580px;margin:auto;padding:12px 16px 40px}.menu{display:grid;grid-template-columns:.92fr 1.08fr 1.52fr 1.08fr 1.62fr 1.52fr 1.78fr 1.12fr 1.5fr;gap:7px;margin-bottom:14px}.menu button,.menu select{width:100%;height:46px;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);font-size:12px;font-weight:700;padding:6px 8px}.menu button.active{background:var(--navy);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.subpanel{background:#fbfcfd;border:1px solid var(--line);border-radius:10px;padding:14px}.heroHome{border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#f8fafc 0%,#eef3f7 100%);padding:18px 22px;margin:2px 0 14px}.heroHome b{display:block;font-size:1.28rem;color:var(--navy)}.heroHome span{color:var(--muted);font-size:.9rem}.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.stat{border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:11px;background:#fff;padding:13px 14px;min-height:94px}.stat label{color:#52677b;font-size:.78rem;font-weight:700;display:block;min-height:32px}.stat strong{display:block;color:var(--navy);font-size:1.75rem;margin-top:7px}
h2,h3,h4{color:var(--navy)}label{display:block;font-weight:700;font-size:13px;margin:9px 0 5px}input,select,textarea{width:100%;border:1px solid #c7d2dc;border-radius:8px;padding:10px;background:#fff}textarea{min-height:90px;resize:vertical}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid31{display:grid;grid-template-columns:3.6fr 1.15fr;gap:24px}.radioRow{display:flex;gap:18px;flex-wrap:wrap}.radioRow label,.inlineCheck{font-weight:600;margin:0}.radioRow input,.inlineCheck input,td input[type=checkbox]{width:auto}.msg{padding:10px 12px;border-radius:8px;margin:10px 0;background:#edf7f1;color:#175f3f}.msg.err{background:#fff0ef;color:#9a231c}.note{padding:10px;border-radius:8px;background:#fff8e7;border:1px solid #efd7a3;color:#805514}.muted{color:var(--muted);font-size:13px}.pill{padding:5px 9px;background:var(--soft);color:var(--navy);border-radius:99px;font-size:12px;font-weight:700}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .grow{flex:1;min-width:220px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}th{background:#eef3f7;position:sticky;top:0;z-index:2}tr:hover td{background:#fafcfd}.status{font-size:11px;font-weight:800;border-radius:99px;padding:4px 7px;background:#eef3f7}.status.draft{color:#6d4c00;background:#fff4cc}.status.approval{color:#174c75;background:#e7f3fd}.status.delivered{color:#14613f;background:#e8f6ee}.status.cancelled{color:#8e1d18;background:#fdeceb}
.photoPreview{width:135px;height:165px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#eee}.signaturePreview{width:230px;height:100px;object-fit:contain;border:1px dashed var(--line);border-radius:8px;background:#fff}.rightInfo{display:grid;gap:10px}.searchItem{display:grid;grid-template-columns:2.1fr 1.4fr 1.8fr .8fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.dangerText{color:var(--danger)}.okText{color:var(--green)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 11px;border-radius:8px;font-weight:700}.tabs button.active{background:var(--navy);color:#fff}.userbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
