<script>
/*
 * Tarayici PDF motoru.
 * ReportLab masaustu koordinatlarini (sol-alt) ayni A4 point uzayinda kullanir,
 * sonra sayfalari canvas uzerinden PDF'e aktarir. Bu yontem Turkce karakterleri
 * tarayicinin font motoruyla dogru basar.
 */

const A4_P={w:595.2756,h:841.8898},A4_L={w:841.8898,h:595.2756};
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Görsel yüklenemedi.'));im.src=src})}
function canvasPage(orientation){const portrait=orientation!=='landscape';const c=document.createElement('canvas');c.width=portrait?1414:2000;c.height=portrait?2000:1414;return c;}
function pagePts(orientation){return orientation==='landscape'?A4_L:A4_P}
function ptX(x,c,p){return Number(x||0)*c.width/p.w}function ptY(y,c,p){return (p.h-Number(y||0))*c.height/p.h}function ptW(w,c,p){return Number(w||0)*c.width/p.w}function ptH(h,c,p){return Number(h||0)*c.height/p.h}
function setCanvasFont(ctx,sizePt,bold,c,p){ctx.font=`${bold?'700':'400'} ${Math.max(1,sizePt*c.height/p.h)}px "Segoe UI",Arial,sans-serif`;ctx.fillStyle='#000';ctx.textBaseline='alphabetic'}
function fitTextPt(ctx,text,maxPt,minPt,maxWidthPt,c,p,bold=true){let s=maxPt;while(s>minPt){setCanvasFont(ctx,s,bold,c,p);if(ctx.measureText(String(text||'')).width<=ptW(maxWidthPt,c,p))break;s-=.25}return Math.max(minPt,s)}
function drawCentered(ctx,text,xPt,yPt,sizePt,c,p,bold=false){setCanvasFont(ctx,sizePt,bold,c,p);ctx.textAlign='center';ctx.fillText(String(text||''),ptX(xPt,c,p),ptY(yPt,c,p))}
function drawLeft(ctx,text,xPt,yPt,sizePt,c,p,bold=false){setCanvasFont(ctx,sizePt,bold,c,p);ctx.textAlign='left';ctx.fillText(String(text||''),ptX(xPt,c,p),ptY(yPt,c,p))}
function wrapCanvas(ctx,text,sizePt,maxWidthPt,c,p,bold=false){setCanvasFont(ctx,sizePt,bold,c,p);const words=String(text||'').trim().split(/\s+/).filter(Boolean),lines=[];let line='';const max=ptW(maxWidthPt,c,p);for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width<=max||!line)line=test;else{lines.push(line);line=w}}if(line)lines.push(line);return lines}
function justifyLine(ctx,line,xPt,yPt,rightPt,sizePt,c,p){setCanvasFont(ctx,sizePt,false,c,p);ctx.textAlign='left';const words=String(line).split(/\s+/);if(words.length<2){drawLeft(ctx,line,xPt,yPt,sizePt,c,p);return}const x=ptX(xPt,c,p),right=ptX(rightPt,c,p),space=ctx.measureText(' ').width;const wordsWidth=words.reduce((a,w)=>a+ctx.measureText(w).width,0);const extra=Math.max(space,(right-x-wordsWidth)/(words.length-1));let cur=x;for(const w of words){ctx.fillText(w,cur,ptY(yPt,c,p));cur+=ctx.measureText(w).width+extra}}
function drawCover(ctx,img,xPt,yBottomPt,wPt,hPt,c,p){const dx=ptX(xPt,c,p),dy=ptY(yBottomPt+hPt,c,p),dw=ptW(wPt,c,p),dh=ptH(hPt,c,p);const sr=img.width/img.height,dr=dw/dh;let sx=0,sy=0,sw=img.width,sh=img.height;if(sr>dr){sw=img.height*dr;sx=(img.width-sw)/2}else{sh=img.width/dr;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh)}
function drawContain(ctx,img,cxPt,yBottomPt,wPt,hPt,c,p){const maxW=ptW(wPt,c,p),maxH=ptH(hPt,c,p),ratio=Math.min(maxW/img.width,maxH/img.height),w=img.width*ratio,h=img.height*ratio;ctx.drawImage(img,ptX(cxPt,c,p)-w/2,ptY(yBottomPt+hPt,c,p)+(maxH-h)/2,w,h)}

async function renderCertificatePages(model){const l=model.template_layout,p=pagePts(l.orientation),c1=canvasPage(l.orientation),ctx=c1.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c1.width,c1.height);
if(!model.template_asset)throw new Error(`${model.template_id} şablon görseli henüz yüklenmemiş. Sistem Ayarları > Şablonlar bölümünden ZIP'teki gerçek şablonu yükleyin.`);
const tpl=await loadImg(model.template_asset);const mm=72/25.4,left=Number(l.margin_left_mm||5)*mm,right=Number(l.margin_right_mm||5)*mm,top=Number(l.margin_top_mm||5)*mm,bottom=Number(l.margin_bottom_mm||5)*mm;ctx.drawImage(tpl,ptX(left,c1,p),ptY(p.h-top,c1,p),ptW(p.w-left-right,c1,p),ptH(p.h-top-bottom,c1,p));
if(model.photo_data){try{drawCover(ctx,await loadImg(model.photo_data),l.photo_x,l.photo_y,l.photo_w,l.photo_h,c1,p)}catch(e){}}
const r=model.record||{};const identity=[['Adı-Soyadı',r.ad_soyad||''],['T.C. Kimlik No',r.tc_kimlik||''],['Ünvanı',r.unvan||''],['Görev Yeri',r.gorev_yeri||'Mülki İdare Amirliği']];const pos=[[l.identity_ad_center_x??l.identity_center_x,l.identity_ad_label_y??l.identity_label_start_y],[l.identity_tc_center_x??l.identity_center_x,l.identity_tc_label_y??l.identity_label_start_y-l.identity_row_gap],[l.identity_unvan_center_x??l.identity_center_x,l.identity_unvan_label_y??l.identity_label_start_y-2*l.identity_row_gap],[l.identity_gorev_center_x??l.identity_center_x,l.identity_gorev_label_y??l.identity_label_start_y-3*l.identity_row_gap]];const fieldW=Math.max(40,Number(l.identity_line_right)-Number(l.identity_line_left)-8),lineSpan=Number(l.identity_line_right)-Number(l.identity_line_left);identity.forEach((row,i)=>{const cx=Number(pos[i][0]),ly=Number(pos[i][1]),vy=ly-Number(l.identity_value_offset);drawCentered(ctx,row[0],cx,ly,Number(l.identity_label_size),c1,p,false);const fs=fitTextPt(ctx,row[1],Number(l.identity_value_size),8.5,fieldW,c1,p,true);drawCentered(ctx,row[1],cx,vy,fs,c1,p,true);ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1,.48*c1.height/p.h);ctx.beginPath();ctx.moveTo(ptX(cx-lineSpan/2,c1,p),ptY(ly-Number(l.identity_line_offset),c1,p));ctx.lineTo(ptX(cx+lineSpan/2,c1,p),ptY(ly-Number(l.identity_line_offset),c1,p));ctx.stroke()});
let tsize=Number(l.taltif_font_size),lines=wrapCanvas(ctx,r.taltif_metni||model.document_settings.default_taltif_text||'',tsize,Number(l.taltif_right)-Number(l.taltif_x),c1,p);while(lines.length>4&&tsize>9.5){tsize-=.25;lines=wrapCanvas(ctx,r.taltif_metni||model.document_settings.default_taltif_text||'',tsize,Number(l.taltif_right)-Number(l.taltif_x),c1,p)}let ty=Number(l.taltif_start_y);lines.slice(0,4).forEach((line,i)=>{if(i<Math.min(lines.length,4)-1)justifyLine(ctx,line,Number(l.taltif_x),ty,Number(l.taltif_right),tsize,c1,p);else drawLeft(ctx,line,Number(l.taltif_x),ty,tsize,c1,p);ty-=Number(l.taltif_leading)});
const signer=model.signer||{},sx=Number(l.signature_center_x);if(model.signature_data){try{drawContain(ctx,await loadImg(model.signature_data),Number(l.signature_image_center_x||sx),Number(l.signature_image_y),Number(l.signature_image_w||120),Number(l.signature_image_h||45),c1,p)}catch(e){}}const nameSize=fitTextPt(ctx,signer.name||r.signer_name||'',Number(l.signature_name_size),9.5,260,c1,p,true);drawCentered(ctx,signer.name||r.signer_name||'',sx,Number(l.signature_name_y),nameSize,c1,p,true);const titles=String(signer.title||r.signer_title||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(titles[0])drawCentered(ctx,titles[0],sx,Number(l.signature_title1_y),Number(l.signature_title_size),c1,p,false);if(titles[1])drawCentered(ctx,titles[1],sx,Number(l.signature_title2_y),Number(l.signature_title_size),c1,p,true);

const c2=canvasPage(l.orientation),b=c2.getContext('2d');b.fillStyle='#fff';b.fillRect(0,0,c2.width,c2.height);const size=14.04,left2=Number(l.page2_date_x||28.32),right2=Number(l.page2_table_right||p.w-28.32),dateY=Number(l.page2_date_y||p.h-80),numX=Number(l.page2_number_x||left2),numY=Number(l.page2_number_y||dateY-17.2);drawLeft(b,model.document_label+'nin:',left2,dateY+18.2,size,c2,p);drawMixed(b,left2,dateY,'Tarihi: ',r.tarih||'',size,c2,p);drawMixed(b,numX,numY,'Sayısı: ',recNo(r),size,c2,p);let headingY=Number(l.page2_heading_y||dateY-68.4);const a=model.approval_letter||{};if(a.date||a.number){const ah=Number(l.page2_approval_heading_y||numY-30),ad=Number(l.page2_approval_date_y||ah-18.2),an=Number(l.page2_approval_number_y||ad-17.2);drawLeft(b,model.document_label+' Olur Yazısının:',left2,ah,size,c2,p);drawMixed(b,left2,ad,'Tarihi: ',a.date||'',size,c2,p);drawMixed(b,numX,an,'Sayısı: ',a.number||'',size,c2,p);headingY=Math.min(headingY,an-27)}drawMixed(b,Number(l.page2_heading_x||left2),headingY,'Verilme Gerekçesi',' :',size,c2,p);
const reasons=(model.reasons||[]).slice(0,4),tableX=Number(l.page2_table_x||left2),tableRight=Number(l.page2_table_right||right2),markW=25,textPad=7,textX=tableX+markW+textPad,textRight=tableRight-textPad,rf=13.2,leading=16.2;const rows=reasons.map(reason=>{const ls=wrapCanvas(b,reason,rf,textRight-textX,c2,p);return{reason,lines:ls,h:Math.max(30,7+ls.length*leading+5)}});let tableTop=Math.min(Number(l.page2_table_top||headingY-21.9),headingY-21.9),total=rows.reduce((a,x)=>a+x.h,0),bottom=tableTop-total;b.strokeStyle='#000';b.lineWidth=Math.max(1,.65*c2.height/p.h);strokeRectPt(b,tableX,bottom,tableRight-tableX,total,c2,p);linePt(b,tableX+markW,bottom,tableX+markW,tableTop,c2,p);let cur=tableTop;rows.forEach((row,i)=>{const rb=cur-row.h;if(i<rows.length-1)linePt(b,tableX,rb,tableRight,rb,c2,p);if(String(row.reason).trim()===String(r.gerekce||'').trim())drawCentered(b,'X',tableX+markW/2,rb+row.h/2-4,size,c2,p);row.lines.forEach((line,j)=>drawLeft(b,line,textX,cur-7-rf-j*leading,rf,c2,p));cur=rb});const law=model.document_settings.legislation_text||'';let lawY=Math.min(Number(l.page2_legislation_y||bottom-36),bottom-36);const lawLines=wrapCanvas(b,law,13.2,Number(l.page2_legislation_right||right2)-Number(l.page2_legislation_x||left2),c2,p);lawLines.forEach((line,i)=>{const y=lawY-i*16.8;if(i<lawLines.length-1)justifyLine(b,line,Number(l.page2_legislation_x||left2),y,Number(l.page2_legislation_right||right2),13.2,c2,p);else drawLeft(b,line,Number(l.page2_legislation_x||left2),y,13.2,c2,p)});return[c1,c2]}
function drawMixed(ctx,x,y,label,value,size,c,p){setCanvasFont(ctx,size,false,c,p);ctx.textAlign='left';const px=ptX(x,c,p),py=ptY(y,c,p);ctx.fillText(label,px,py);const w=ctx.measureText(label).width;setCanvasFont(ctx,size,true,c,p);ctx.fillText(value,px+w,py)}
function linePt(ctx,x1,y1,x2,y2,c,p){ctx.beginPath();ctx.moveTo(ptX(x1,c,p),ptY(y1,c,p));ctx.lineTo(ptX(x2,c,p),ptY(y2,c,p));ctx.stroke()}
function strokeRectPt(ctx,x,y,w,h,c,p){ctx.strokeRect(ptX(x,c,p),ptY(y+h,c,p),ptW(w,c,p),ptH(h,c,p))}

async function generateCertificatePdf(recordId){try{if(!confirm('PDF hazırlansın mı? Bu işlem sırasında kayda resmî tarih ve sayı verilir.'))return;msg('PDF hazırlanıyor...');const model=failIf(await api('getPdfModel',TOKEN,recordId));const pages=await renderCertificatePages(model),orientation=model.template_layout.orientation==='landscape'?'landscape':'portrait',p=pagePts(model.template_layout.orientation),jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({orientation,unit:'pt',format:'a4',compress:true});pdf.addImage(pages[0].toDataURL('image/jpeg',.96),'JPEG',0,0,p.w,p.h,undefined,'FAST');pdf.addPage('a4',orientation);pdf.addImage(pages[1].toDataURL('image/jpeg',.96),'JPEG',0,0,p.w,p.h,undefined,'FAST');const type=model.document_type==='USTUN_BASARI'?'Ustun_Basari':'Basari',safe=String(model.record.ad_soyad||'Belge').replace(/[^a-zA-Z0-9ğüşöçıİĞÜŞÖÇ]+/g,'_'),name=`${type}_${model.record.yil}_${String(model.record.sayi).padStart(3,'0')}_${safe}.pdf`,data=pdf.output('datauristring').split(',')[1];failIf(await api('saveGeneratedPdfWeb',TOKEN,recordId,data,name));pdf.save(name);msg('PDF, masaüstündeki şablon koordinatlarıyla hazırlandı ve Drive’a kaydedildi.');await loadApproval();}catch(e){msg(e.message,true)}}
async function downloadStoredPdf(recordId){try{const r=failIf(await api('getStoredPdfWeb',TOKEN,recordId));downloadBase64(r.name,r.base64,'application/pdf')}catch(e){msg(e.message,true)}}
async function downloadPdfZip(ids){try{const r=failIf(await api('createStoredPdfZipWeb',TOKEN,ids));downloadBase64(r.name,r.base64,'application/zip');msg(`${r.count} PDF ZIP olarak indirildi.${r.missing?.length?' PDF bulunamayan kayıt: '+r.missing.length:''}`)}catch(e){msg(e.message,true)}}
async function downloadSelectedBackup(ids){try{const r=failIf(await api('createSelectedBackupWeb',TOKEN,ids));downloadBase64(r.name,r.base64,'application/zip');msg(`${r.count} kayıt seçili yedek olarak indirildi.`)}catch(e){msg(e.message,true)}}
</script>
