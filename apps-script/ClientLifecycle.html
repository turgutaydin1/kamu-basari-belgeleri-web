<script>
(function(){
  let booting=false;

  function ensureLoadingBox(){
    if(document.getElementById('appLoadingOverlay')) return;
    const d=document.createElement('div');
    d.id='appLoadingOverlay';
    d.className='hidden';
    d.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(244,247,250,.94);display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Arial,sans-serif;color:#173a5e';
    d.innerHTML='<div style="background:#fff;border:1px solid #d7e0e8;border-radius:14px;padding:22px 28px;box-shadow:0 15px 40px rgba(20,45,70,.14);font-weight:700">Sistem hazırlanıyor...</div>';
    document.body.appendChild(d);
  }
  function loading(on,text){
    ensureLoadingBox();
    const d=document.getElementById('appLoadingOverlay');
    if(text) d.firstElementChild.textContent=text;
    d.classList.toggle('hidden',!on);
  }
  function timeout(p,ms,label){
    return Promise.race([
      p,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error(label||'İstek zaman aşımına uğradı.')),ms))
    ]);
  }
  function showHomeNow(){
    document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
    const home=$('page-home'); if(home) home.classList.remove('hidden');
    document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));
    const hb=document.querySelector('.menu button[data-page="home"]'); if(hb) hb.classList.add('active');
  }
  function showShell(){
    $('landing').classList.add('hidden');
    $('application').classList.remove('hidden');
    if(USER){
      $('userName').textContent=USER.full_name||USER.email||'';
      $('userPlan').textContent=USER.plan==='FULL'?'Tam Sürüm':'Demo';
      $('adminShortcut').classList.toggle('hidden',USER.role!=='ADMIN');
    }
    showHomeNow();
  }

  window.enterApp = async function(){
    if(booting) return;
    booting=true;
    loading(true,'Sistem hazırlanıyor...');
    try{
      if(!TOKEN) throw new Error('Oturum bulunamadı.');
      if(!USER){
        try{
          const s=failIf(await timeout(api('getSession',TOKEN),5000,'Oturum doğrulaması gecikti.'));
          USER=s.user;
        }catch(e){
          console.warn('getSession timeout/failure',e);
        }
      }

      // Kabuk ve Ana Sayfa hiçbir ağır çağrıyı beklemeden görünür olsun.
      showShell();
      loading(false);

      // Dashboard öncelikli; ayarlar daha sonra gelebilir.
      try{
        await timeout(loadDashboard(),6000,'Ana Sayfa verileri gecikti.');
      }catch(e){
        console.warn('dashboard timeout/failure',e);
        const gm=$('globalMsg');
        if(gm) gm.innerHTML='<div class="note">Ana Sayfa açıldı. Veriler gecikirse birkaç saniye içinde otomatik yenilenecek.</div>';
        setTimeout(()=>{ try{loadDashboard()}catch(_){} },1200);
      }

      // Ayarlar açılışı bloke etmez.
      timeout(loadSettingsAll(),7000,'Ayarlar gecikti.')
        .catch(e=>{
          console.warn('settings timeout/failure',e);
          setTimeout(()=>{ try{loadSettingsAll()}catch(_){} },1800);
        });
    }catch(e){
      console.error('enterApp',e);
      if(!TOKEN){
        $('landing').classList.remove('hidden');
        $('application').classList.add('hidden');
      }else{
        showShell();
      }
    }finally{
      booting=false;
      loading(false);
    }
  };

  async function recoverVisibleApp(){
    if(document.visibilityState!=='visible') return;
    try{
      document.documentElement.style.visibility='visible';
      document.body.style.visibility='visible';
      document.body.style.opacity='1';
      if(!TOKEN) return;
      const app=$('application');
      const landing=$('landing');
      if(!app || app.classList.contains('hidden')){
        await enterApp();
        return;
      }
      if(landing && !landing.classList.contains('hidden')) landing.classList.add('hidden');
      const noVisiblePage=[...document.querySelectorAll('.page')].every(p=>p.classList.contains('hidden'));
      if(noVisiblePage) showHomeNow();
      document.body.style.transform='translateZ(0)';
      requestAnimationFrame(()=>{document.body.style.transform='';});
    }catch(e){console.error('recoverVisibleApp',e);}
  }

  window.addEventListener('pageshow',()=>setTimeout(recoverVisibleApp,50));
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible') setTimeout(recoverVisibleApp,120);
  });
  window.addEventListener('focus',()=>setTimeout(recoverVisibleApp,80));

  window.addEventListener('load',()=>{
    ensureLoadingBox();
    if(TOKEN) setTimeout(()=>enterApp(),120);
  });
})();
</script>
